# SonarQube Project Configuration — AirGap Scanner
# WO-067: Configure Parallel Security Scan Stage in Pipeline
#
# Quality gate: zero critical issues, zero blocker issues.
# Pipeline fails if either threshold is exceeded.

# ---------------------------------------------------------------------------
# Project identification
# ---------------------------------------------------------------------------
sonar.projectKey=airgap-scanner
sonar.organization=opsera
sonar.projectName=AirGap Scanner
sonar.projectVersion=1.0

# ---------------------------------------------------------------------------
# Source and test paths
# ---------------------------------------------------------------------------
sonar.sources=src
sonar.tests=src

# Source file encoding
sonar.sourceEncoding=UTF-8

# TypeScript language settings
sonar.typescript.tsconfigPath=tsconfig.json

# ---------------------------------------------------------------------------
# Exclusions — generated code, third-party types, test files, build output
# ---------------------------------------------------------------------------
# Exclude build output and package manager directories
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.vite/**,\
  **/public/**

# Exclude test files from production source analysis
# (they are analysed separately under sonar.test.inclusions)
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/test-utils/**,\
  **/test/**

# Exclude generated and auto-formatted files from duplication detection
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# ---------------------------------------------------------------------------
# Coverage report paths (generated by Vitest with v8 coverage)
# ---------------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ---------------------------------------------------------------------------
# Quality gate configuration
# Block the pipeline on critical or blocker issues (zero-tolerance).
# The quality gate itself is defined in the SonarQube server UI and referenced
# by name; this property instructs the scanner to wait for the gate result.
# ---------------------------------------------------------------------------
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
