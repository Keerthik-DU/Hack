# Gitleaks Configuration — AirGap Scanner
# WO-067: Configure Parallel Security Scan Stage in Pipeline
#
# Quality gate: zero secret findings.
# Pipeline fails if any secrets are detected outside of documented allowlisted paths.
#
# This configuration extends the default Gitleaks ruleset (which covers AWS keys,
# GitHub tokens, generic high-entropy strings, and 100+ other secret patterns).
#
# Allowlist rationale:
# AirGap Scanner is itself a secret detection tool. Its test suite necessarily
# contains intentional example secret patterns (e.g., dummy AWS access keys,
# fake GitHub tokens) used to validate the regex detection engine. These patterns
# are not real credentials — they follow the format of real secrets but use
# obviously fake values (e.g., "AKIA1234567890EXAMPLEKEY1"). The allowlist
# below restricts the exception to specific test fixture directories only,
# preserving full detection coverage on all production source files.

[extend]
# Extend the built-in Gitleaks default ruleset (covers 100+ secret patterns
# including AWS, GCP, GitHub, Stripe, Twilio, generic high-entropy strings, etc.)
useDefault = true

# ---------------------------------------------------------------------------
# Global allowlist — paths that are never scanned for secrets
# ---------------------------------------------------------------------------
[allowlist]
description = "Paths excluded from Gitleaks scanning"

# Exclude lock files: package-lock.json may contain integrity hashes that
# superficially resemble high-entropy strings but are never real secrets.
# These files are deterministically generated by npm and audited separately by Snyk.
paths = [
  '''package-lock\.json$''',
]

# ---------------------------------------------------------------------------
# Test fixture allowlists — intentional example secret patterns
#
# The following directories contain fake secret strings used as test inputs
# to validate the regex detection engine. Each allowlist entry is limited to
# the minimum necessary path scope and includes a rationale comment.
# ---------------------------------------------------------------------------

[[allowlists]]
description = """
src/__tests__/fixtures — unit test fixtures for the scan orchestrator,
findings aggregator, and confidence scorer. Contains dummy AWS access keys
(e.g., AKIA1234567890EXAMPLEKEY1) and fake GitHub tokens used as test inputs
to validate detection logic. These are not real credentials.
"""
paths = [
  '''src/__tests__/fixtures/.*''',
]

[[allowlists]]
description = """
src/engines/__tests__ — unit tests for the regex detection engine and pattern
registry. Contains example secret strings (AWS keys, GitHub tokens, etc.) as
expected match inputs to verify that individual regex patterns fire correctly.
These strings are synthetic test data, not real credentials.
"""
paths = [
  '''src/engines/__tests__/.*''',
]

[[allowlists]]
description = """
src/engines/entropy/__tests__ — unit tests for the entropy analyzer. Contains
high-entropy strings and variable assignment patterns (e.g., password = "...")
designed to exercise entropy thresholds, dictionary filtering, and contextual
signal analysis. These are synthetic test vectors, not real credentials.
"""
paths = [
  '''src/engines/entropy/__tests__/.*''',
]

[[allowlists]]
description = """
src/orchestration/__fixtures__ — code samples used as orchestration-layer
test fixtures. May contain realistic-looking code snippets with credential
assignment patterns to test the full scan pipeline end-to-end.
"""
paths = [
  '''src/orchestration/__fixtures__/.*''',
]

[[allowlists]]
description = """
src/hooks/__fixtures__ — mock data for React hook tests including useScanEngine.
May contain synthetic finding objects referencing fake secret values for UI
rendering tests.
"""
paths = [
  '''src/hooks/__fixtures__/.*''',
]

[[allowlists]]
description = """
src/test/fixtures — integration and unit test fixtures shared across test suites.
Contains synthetic scan results, pattern test data, and example findings with
masked secret previews. These are not real credentials.
"""
paths = [
  '''src/test/fixtures/.*''',
]

[[allowlists]]
description = """
src/patterns/v1/patterns.json — bundled regex pattern definitions derived from
the Gitleaks/Secrets Patterns DB ruleset. The file contains the regex patterns
themselves (e.g., the AWS access key regex) which Gitleaks may self-flag as
secret detection patterns. This is the pattern source file, not a secrets file.
"""
paths = [
  '''src/patterns/v1/patterns\.json$''',
  '''src/engines/regex/patterns\.json$''',
]
