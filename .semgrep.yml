# Semgrep SAST Configuration — AirGap Scanner
# WO-051: ESLint and Semgrep Prohibited Security Patterns Enforcement
# WO-067: Configure Parallel Security Scan Stage in Pipeline
#
# Quality gate: zero critical (ERROR severity) and zero high (WARNING severity) findings.
# Pipeline fails if any rule below fires on production source files.
#
# Rules target TypeScript and React security patterns specific to this codebase.
# Generic or noisy rules are intentionally excluded to avoid false positives.
# False-positive exceptions require an inline `# nosemgrep: <rule-id>` comment
# with an explanatory note describing why the usage is safe.
#
# Note: Semgrep's `typescript` language mode covers both .ts and .tsx files.
# Dynamic import() is intentionally not flagged — it is a legitimate ES module feature.

rules:
  # ---------------------------------------------------------------------------
  # (1) XSS — dangerouslySetInnerHTML (React)
  # Architecture Security Zone 2 / OWASP A05
  # ---------------------------------------------------------------------------
  - id: react-dangerously-set-inner-html
    message: >
      PROHIBITED (Security Zone 2): dangerouslySetInnerHTML bypasses React's
      built-in XSS escaping. Unsanitized __html enables XSS and can defeat CSP
      intent. Safe alternative: render with normal JSX text/elements so React
      escapes content. If HTML sanitization is truly required, use DOMPurify and
      document an explicit exception in SECURITY.md.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A05:2021 - Security Misconfiguration / Injection"
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation (XSS)"
      fix: "Use React JSX children instead of dangerouslySetInnerHTML"
    patterns:
      - pattern-either:
          - pattern: dangerouslySetInnerHTML={...}
          - pattern: dangerouslySetInnerHTML={{ __html: ... }}

  # ---------------------------------------------------------------------------
  # (2) Code injection — eval / Function / setTimeout-string
  # Architecture Security Zone 2 / OWASP A03
  # ---------------------------------------------------------------------------
  - id: no-eval
    message: >
      PROHIBITED (Security Zone 2): eval() executes arbitrary JavaScript from a
      string and is blocked by a strict CSP. Safe alternatives: JSON.parse for
      data, static imports or a well-defined interpreter for structured logic.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      fix: "Replace eval() with JSON.parse or static code paths"
    patterns:
      - pattern: eval(...)

  - id: no-new-function
    message: >
      PROHIBITED (Security Zone 2): new Function() constructs executable code
      from a string (equivalent to eval) and is blocked by a strict CSP.
      Safe alternative: define static functions or use a typed dispatch table.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      fix: "Replace new Function() with a static function definition"
    patterns:
      - pattern: new Function(...)

  - id: no-settimeout-string
    message: >
      PROHIBITED (Security Zone 2): setTimeout() with a string argument is an
      implied eval and is blocked by CSP. Safe alternative:
      setTimeout(() => { ... }, delay) with a function callback.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      fix: "Pass a function to setTimeout, never a string"
    patterns:
      - pattern-either:
          - pattern: setTimeout("...", ...)
          - pattern: setTimeout('...', ...)

  - id: no-setinterval-string
    message: >
      PROHIBITED (Security Zone 2): setInterval() with a string argument is an
      implied eval and is blocked by CSP. Safe alternative:
      setInterval(() => { ... }, delay) with a function callback.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      fix: "Pass a function to setInterval, never a string"
    patterns:
      - pattern-either:
          - pattern: setInterval("...", ...)
          - pattern: setInterval('...', ...)

  # ---------------------------------------------------------------------------
  # (3) Insecure postMessage — missing or wildcard origin validation
  # Architecture Security Zone 2 / OWASP A05
  # Web Worker postMessage (single-arg) is not flagged by the wildcard rule.
  # ---------------------------------------------------------------------------
  - id: postmessage-wildcard-origin
    message: >
      PROHIBITED (Security Zone 2): postMessage() with wildcard origin ('*')
      can leak data to any frame. Safe alternative: pass an explicit target
      origin such as window.location.origin. Web Worker postMessage has no
      targetOrigin argument — suppress only with a documented nosemgrep note.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A05:2021 - Security Misconfiguration"
      cwe: "CWE-346: Origin Validation Error"
      fix: "Replace '*' with an explicit trusted origin"
    patterns:
      - pattern: $TARGET.postMessage($DATA, "*")

  - id: missing-message-origin-check
    message: >
      PROHIBITED (Security Zone 2): message event handler does not validate
      event.origin before using event.data. An attacker-controlled frame could
      inject messages. Safe alternative: if (event.origin !== expectedOrigin) return;
      before reading event.data. Web Worker handlers that are same-origin by
      design may suppress with a documented nosemgrep note.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A05:2021 - Security Misconfiguration"
      cwe: "CWE-346: Origin Validation Error"
      fix: "Validate event.origin against an allowlist before processing"
    patterns:
      - pattern-either:
          - pattern: |
              self.addEventListener('message', function($EVENT) {
                ...
              })
          - pattern: |
              window.addEventListener('message', function($EVENT) {
                ...
              })
          - pattern: |
              $TARGET.addEventListener('message', ($EVENT) => {
                ...
              })
      - pattern-not: |
          self.addEventListener('message', function($EVENT) {
            ...
            $EVENT.origin
            ...
          })
      - pattern-not: |
          window.addEventListener('message', function($EVENT) {
            ...
            $EVENT.origin
            ...
          })
      - pattern-not: |
          $TARGET.addEventListener('message', ($EVENT) => {
            ...
            $EVENT.origin
            ...
          })

  # ---------------------------------------------------------------------------
  # (4) XSS — template literal assignment to innerHTML / outerHTML
  # Architecture Security Zone 2 / OWASP A05
  # Intentionally targets DOM sinks only — not CSS-in-JS template macros.
  # ---------------------------------------------------------------------------
  - id: no-innerhtml-template-literal
    message: >
      PROHIBITED (Security Zone 2): assigning a template literal with
      interpolation to innerHTML creates an XSS sink. Safe alternatives:
      element.textContent for plain text, or React JSX which escapes by default.
      Do not use for CSS-in-JS macros — this rule only targets DOM sinks.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A05:2021 - Security Misconfiguration / Injection"
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation (XSS)"
      fix: "Use textContent or React JSX instead of innerHTML with interpolation"
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = `...${ $VAR }...`
          - pattern: $EL.innerHTML = `${ $VAR }...`
          - pattern: $EL.innerHTML = `...${ $VAR }`

  - id: no-outerhtml-template-literal
    message: >
      PROHIBITED (Security Zone 2): assigning a template literal with
      interpolation to outerHTML creates an XSS sink. Safe alternatives:
      update the DOM via textContent, createElement, or React JSX.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A05:2021 - Security Misconfiguration / Injection"
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation (XSS)"
      fix: "Use textContent, createElement, or React JSX instead of outerHTML"
    patterns:
      - pattern-either:
          - pattern: $EL.outerHTML = `...${ $VAR }...`
          - pattern: $EL.outerHTML = `${ $VAR }...`
          - pattern: $EL.outerHTML = `...${ $VAR }`

  - id: no-innerhtml-concat
    message: >
      PROHIBITED (Security Zone 2): concatenating variables into innerHTML
      creates an XSS sink. Safe alternatives: textContent for plain text, or
      React JSX escaping.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A05:2021 - Security Misconfiguration / Injection"
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation (XSS)"
      fix: "Use textContent or React JSX instead of string concat into innerHTML"
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $VAR + ...
          - pattern: $EL.innerHTML = "..." + $VAR

  # ---------------------------------------------------------------------------
  # Prototype pollution
  # OWASP A03 Injection
  # ---------------------------------------------------------------------------
  - id: no-prototype-pollution
    message: >
      Direct assignment to __proto__ enables prototype pollution attacks, which
      can override built-in Object methods and corrupt application state.
      Use Object.create(null) for plain data maps or Object.assign with a null
      prototype target.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      owasp: "A03:2021 - Injection"
      cwe: "CWE-1321: Improperly Controlled Modification of Object Prototype Attributes"
      fix: "Use Object.create(null) instead of mutating __proto__"
    patterns:
      - pattern-either:
          - pattern: $OBJ.__proto__ = ...
          - pattern: $OBJ["__proto__"] = ...
