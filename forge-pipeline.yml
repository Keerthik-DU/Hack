---
# Forge Shipping Engine Pipeline Configuration
# AirGap Scanner - Source Trigger, Build, Security Scan, and Artifact Push
# WO-066: Configure Forge Source Trigger and Build Stage
# WO-067: Configure Parallel Security Scan Stage in Pipeline
# WO-068: Configure Artifact Push Stage with Integrity Checksums

pipeline:
  name: airgap-scanner
  description: >
    Automated build pipeline for AirGap Scanner. Triggers on main branch
    commits and pull request events. Performs secure dependency installation,
    TypeScript strict-mode compilation, Vite production build with Web Worker
    support, model manifest verification, parallel security scanning, and
    artifact registry push with SHA-256 integrity checksums.

# ---------------------------------------------------------------------------
# Source Stage — VCS trigger configuration
# ---------------------------------------------------------------------------
source:
  provider: git
  triggers:
    - event: push
      branches:
        - main
    - event: pull_request
      actions:
        - opened
        - synchronize
  variables:
    COMMIT_SHA: ${{ vcs.commit_sha }}
    COMMIT_SHA_SHORT: ${{ vcs.commit_sha_short }}
    BUILD_TIMESTAMP: ${{ pipeline.timestamp_iso8601 }}
    ARTIFACT_VERSION_TAG: ${{ vcs.commit_sha_short }}
    ARTIFACT_REGISTRY_URL: ${{ pipeline.artifact_registry_url }}

# ---------------------------------------------------------------------------
# Build Stage — build:node step from the Forge step catalog
# ---------------------------------------------------------------------------
stages:
  - name: build
    step: build:node
    node_version: "20"
    environment:
      VITE_COMMIT_SHA: ${{ source.variables.COMMIT_SHA }}
      VITE_BUILD_TIMESTAMP: ${{ source.variables.BUILD_TIMESTAMP }}
    commands:
      # Step 1: Secure dependency installation (OWASP A03 compliance)
      # npm ci --ignore-scripts prevents post-install script attacks
      - npm ci --ignore-scripts

      # Step 2: TypeScript type checking in strict mode (noEmit — Vite handles transpilation)
      - npx tsc --noEmit

      # Step 3: Vite production build (tree-shaking, code splitting, minification,
      #         Web Worker bundle, Tailwind CSS purge)
      - npx vite build

      # Step 4: Verify model-manifest.json exists in dist/ output
      - bash scripts/verify-manifest.sh

    artifacts:
      paths:
        - dist/
      metadata:
        commit_sha: ${{ source.variables.COMMIT_SHA }}
        build_timestamp: ${{ source.variables.BUILD_TIMESTAMP }}

    timeout_minutes: 2

    on_failure:
      message: >
        Build stage failed. Common causes:
        - TypeScript type errors: check tsc output for file, line, and error code.
        - npm ci failure: verify package-lock.json is in sync with package.json.
        - Missing model-manifest.json: ensure model-manifest.json exists at repo root
          and is copied to dist/ by the Vite build, or set SKIP_MANIFEST_CHECK=true
          to bypass the manifest check during early development.
        - Web Worker bundle failure: ensure src/workers/llm-worker.ts exists.

# ---------------------------------------------------------------------------
# Security Scan Stage — four parallel scanners (OWASP A03, A05)
# WO-067: SonarQube, Snyk, Gitleaks, Semgrep running in parallel
# Quality gates: zero critical/blocker (Sonar), zero critical/high CVE (Snyk),
#                zero secrets (Gitleaks), zero critical/high (Semgrep)
# ALL gates must pass (AND logic) before pipeline proceeds to Push stage.
# ---------------------------------------------------------------------------
  - name: security-scan
    parallel:
      # --- SonarQube: static analysis, code quality, security hotspots ---
      - name: sonarqube
        step: scan:sonarqube
        config_file: sonar-project.properties
        quality_gate:
          block_on: critical
          block_on: blocker
          zero_tolerance: true
        on_failure:
          message: >
            SonarQube quality gate failed.
            - Critical or blocker issues detected in source code.
            - Review the SonarQube dashboard for specific issues, file paths, and
              remediation guidance: ${{ pipeline.sonarqube_dashboard_url }}
            - Infrastructure failure (SonarQube server unavailable): contact the
              platform team — do NOT re-run to bypass.

      # --- Snyk: dependency vulnerability scanning (SCA) for npm packages ---
      - name: snyk
        step: scan:snyk
        config:
          package_manager: npm
          manifest_files:
            - package.json
            - package-lock.json
          severity_threshold: high
          include_transitive: true
          all_projects: true
        quality_gate:
          fail_on: critical
          fail_on: high
          zero_tolerance: true
        on_failure:
          message: >
            Snyk SCA gate failed.
            - Critical or high-severity CVEs found in npm dependencies
              (including transitive dependencies).
            - Each failing package is listed with CVE ID and recommended fix version.
            - Upgrade or replace the affected packages, then re-run the pipeline.
            - Infrastructure failure (Snyk API timeout): contact the platform team —
              do NOT re-run to bypass.

      # --- Gitleaks: secret scanning of source repository ---
      - name: gitleaks
        step: scan:gitleaks
        config_file: .gitleaks.toml
        quality_gate:
          zero_findings: true
        on_failure:
          message: >
            Gitleaks secret scan failed.
            - One or more secrets or credentials were detected in the repository.
            - The scan output lists the file path, line number, and secret type for
              each finding.
            - Remove the secret from the codebase, rotate the compromised credential,
              and rewrite git history if the secret was committed. Contact Security.
            - If the finding is a test fixture false-positive not already in the
              allowlist, add the path to .gitleaks.toml [[allowlists]] with a
              comment explaining the rationale, then re-run.
            - Infrastructure failure (Gitleaks binary unavailable): contact the
              platform team — do NOT re-run to bypass.

      # --- Semgrep: SAST for TypeScript/React security patterns ---
      - name: semgrep
        step: scan:semgrep
        config_file: .semgrep.yml
        quality_gate:
          fail_on: error
          fail_on: warning
          zero_tolerance: true
        on_failure:
          message: >
            Semgrep SAST gate failed.
            - Critical or high-severity TypeScript/React security rule violations found.
            - Each finding includes the rule ID, file path, line number, and a
              description of the security concern.
            - Review and remediate each finding before re-running the pipeline.
            - If a finding is a documented false-positive (e.g., a safe postMessage
              in the Web Worker communication layer), add an inline nosemgrep comment
              with an explanatory note and the rule ID.
            - Infrastructure failure (Semgrep service unavailable): contact the
              platform team — do NOT re-run to bypass.

    # All four scan steps share a single 5-minute timeout budget.
    # Parallel execution ensures total wall-clock time equals the slowest scanner.
    timeout_minutes: 5

    on_failure:
      block_pipeline: true
      message: >
        Security Scan stage failed. One or more quality gates did not pass.
        Review the individual scanner outputs above for specific findings.
        The pipeline will not proceed to the Push stage until all four gates pass.
        See PIPELINE.md for quality gate thresholds, allowlist rationale, and
        escalation contacts.

# ---------------------------------------------------------------------------
# Zero-Network E2E Stage — test:generic (WO-050)
# Asserts exactly zero outbound network requests during scan operations.
# Failure blocks promotion to subsequent environments / Push stage.
# ---------------------------------------------------------------------------
  - name: zero-network-e2e
    step: test:generic
    needs:
      - build
      - security-scan
    node_version: "20"
    environment:
      CI: "true"
    commands:
      # Playwright webServer (playwright.config.ts) starts `vite preview` when
      # PLAYWRIGHT_BASE_URL is unset. Failure blocks promotion (block_pipeline).
      - npm ci --ignore-scripts
      - npx playwright install --with-deps chromium webkit
      # Use vite build for the preview bundle (typecheck already ran in build stage).
      - npx vite build
      - npm run test:e2e:network
    artifacts:
      paths:
        - test-results/
        - playwright-report/
        - test-results/network-reports/
    timeout_minutes: 10
    on_failure:
      block_pipeline: true
      message: >
        Zero-network E2E stage failed (WO-050). One or more Playwright scenarios
        detected outbound network activity during the scan-execution window, or
        the scan UI did not complete as expected. Review the Playwright report
        and network-reports JSON artifacts for request URL/method/initiator
        details. This gate must pass before promotion.

# ---------------------------------------------------------------------------
# Push Stage — push:generic with SHA-256 integrity checksums (OWASP A08)
# WO-068: Upload dist/ to the artifact registry with commit-SHA version tags.
# Runs only after Security Scan and Zero-Network E2E pass (stage ordering).
# ---------------------------------------------------------------------------
  - name: push
    step: push:generic
    # Explicit dependency: Push must not run unless prior gates succeeded.
    needs:
      - security-scan
      - zero-network-e2e
    artifact_source: dist/
    version_tag: ${{ source.variables.ARTIFACT_VERSION_TAG }}
    # Immutable tags: refuse overwrite if the same version tag already exists.
    immutable: true
    fail_on_duplicate_tag: true
    environment:
      COMMIT_SHA: ${{ source.variables.COMMIT_SHA }}
      COMMIT_SHA_SHORT: ${{ source.variables.COMMIT_SHA_SHORT }}
      BUILD_TIMESTAMP: ${{ source.variables.BUILD_TIMESTAMP }}
      ARTIFACT_VERSION_TAG: ${{ source.variables.ARTIFACT_VERSION_TAG }}
      ARTIFACT_REGISTRY_URL: ${{ source.variables.ARTIFACT_REGISTRY_URL }}
      # Defense-in-depth: never skip the model-manifest gate at push time.
      SKIP_MANIFEST_CHECK: "false"
    commands:
      # Gate 1: Re-verify model-manifest.json exists in the artifact bundle.
      - bash scripts/verify-manifest.sh

      # Gate 2: Generate SHA-256 checksums for every file under dist/.
      # Writes checksums.sha256 at repo root (not inside dist/) for metadata.
      - bash scripts/generate-checksums.sh

    metadata:
      commit_sha: ${{ source.variables.COMMIT_SHA }}
      commit_sha_short: ${{ source.variables.COMMIT_SHA_SHORT }}
      build_timestamp: ${{ source.variables.BUILD_TIMESTAMP }}
      artifact_version_tag: ${{ source.variables.ARTIFACT_VERSION_TAG }}
      artifact_registry_url: ${{ source.variables.ARTIFACT_REGISTRY_URL }}
      # Include the full checksums manifest content in pipeline metadata for
      # independent post-push integrity verification and audit trail.
      checksums_manifest_file: checksums.sha256
      checksums_manifest: ${{ file:checksums.sha256 }}

    # Push (verify + checksum + upload) must complete within 1 minute.
    timeout_minutes: 1

    on_failure:
      block_pipeline: true
      message: >
        Push stage failed. Distinguish the failure mode from the step output:
        - Validation error (missing model-manifest.json): ensure the Build stage
          copied model-manifest.json into dist/; do NOT set SKIP_MANIFEST_CHECK
          for the Push stage.
        - Validation error (empty dist/): the Build stage produced no artifacts;
          re-run from Build and inspect the Vite build output.
        - Validation error (checksum generation): review which file could not be
          hashed and fix permissions or path issues.
        - Duplicate version tag: artifacts are immutable — the same commit SHA
          tag already exists in the registry. Rebuild from a new commit or
          retrieve the existing artifact by version tag for rollback.
        - Infrastructure error (registry unavailable / network timeout): contact
          the platform team and retry the pipeline after the registry is healthy.
        See PIPELINE.md for artifact retrieval, checksum verification, and
        escalation contacts.

# ---------------------------------------------------------------------------
# Gate Stage — manual approval + quality dashboard (WO-069)
# ---------------------------------------------------------------------------
  - name: gate
    step: gate:manual-approval
    needs:
      - push
    environment: quality-review
    approval:
      required: true
      roles:
        - release-manager
        - security-champion
    dashboard:
      metrics:
        - name: bundle-size
          command: node scripts/check-bundle-size.mjs
        - name: lighthouse-perf
          command: bash scripts/run-lighthouse.sh
        - name: precision-recall
          command: npm test -- tests/metrics/precision-recall.test.ts
      budgets_file: .bundle-budget.json
      lighthouse_config: lighthouserc.js
    timeout_minutes: 60
    on_failure:
      block_pipeline: true
      message: >
        Gate stage failed or was rejected. Bundle budget, Lighthouse, or metrics
        dashboard checks did not meet thresholds, or an approver rejected promotion.
        See PIPELINE.md quality dashboard section.

# ---------------------------------------------------------------------------
# Deploy Stage — multi-environment with post-deploy tests (WO-070)
# ---------------------------------------------------------------------------
  - name: deploy-staging
    step: deploy:static
    needs:
      - gate
    environment: staging
    artifact_source: dist/
    target: ${{ pipeline.staging_url }}
    commands:
      - npm ci --ignore-scripts
      - npx vite build
      - bash scripts/verify-manifest.sh
      - bash scripts/deploy-static.sh staging
    post_deploy:
      - name: smoke
        command: PLAYWRIGHT_BASE_URL=${{ pipeline.staging_url }} npx playwright test tests/e2e/cross-browser.spec.ts --project=chromium
      - name: zero-network
        command: PLAYWRIGHT_BASE_URL=${{ pipeline.staging_url }} npm run test:e2e:network
    timeout_minutes: 15
    on_failure:
      block_pipeline: true
      message: >
        Staging deploy or post-deploy tests failed. Do not promote to production.

  - name: deploy-production
    step: deploy:static
    needs:
      - deploy-staging
    environment: production
    artifact_source: dist/
    target: ${{ pipeline.production_url }}
    approval:
      required: true
      roles:
        - release-manager
    commands:
      - bash scripts/deploy-static.sh production
    post_deploy:
      - name: smoke
        command: PLAYWRIGHT_BASE_URL=${{ pipeline.production_url }} npx playwright test tests/e2e/cross-browser.spec.ts --project=chromium
      - name: rollback-hint
        command: echo "On failure run shipping_trigger_rollback for this pipeline"
    timeout_minutes: 15
    on_failure:
      block_pipeline: true
      message: >
        Production deploy failed. Initiate rollback via Forge shipping engine.
        See PIPELINE.md deploy/rollback section.
